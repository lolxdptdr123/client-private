      <h1>System requirements</h1>
      <ul>
        <li>Windows 10 or 11, 64-bit</li>
        <li>Minecraft 1.7.10 or 1.8.9 (Vanilla or Forge)</li>
        <li>A working Java runtime used by that install</li>
        <li>Administrator rights only if your launcher needs them</li>
      </ul>
      <p>Lunar can work, then break after an update. Vanilla or Forge is the supported path.</p>
