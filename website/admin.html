<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin | Helix</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="nav-wrap" data-nav=""></div>
    <div class="spacer"></div>
    <main class="page-narrow">
      <h1>Admin</h1>
      <p class="lede">Publish changelog entries and update Discord / Telegram links.</p>

      <form id="login-form" class="admin-card">
        <h2>Sign in</h2>
        <p><input id="admin-password" type="password" required placeholder="Admin password" /></p>
        <button class="btn btn-accent" type="submit">Log in</button>
        <div class="alert error" id="login-error">Wrong password, or the API server is not running.</div>
      </form>

      <div id="admin-app" class="hidden">
        <section class="admin-card">
          <h2>New changelog entry</h2>
          <form id="add-log">
            <p><input id="log-date" type="date" required /></p>
            <p><input id="log-version" type="text" required placeholder="Version, e.g. 2.4.2" /></p>
            <p><textarea id="log-body" required placeholder="What changed?"></textarea></p>
            <button class="btn btn-accent" type="submit">Publish</button>
            <div class="alert" id="log-ok">Entry published.</div>
          </form>
        </section>

        <section class="admin-card">
          <h2>Contact links</h2>
          <form id="save-contact">
            <p><input id="discord-url" type="url" required placeholder="https://discord.gg/invite" /></p>
            <p><input id="telegram-url" type="url" required placeholder="https://t.me/username" /></p>
            <button class="btn btn-light" type="submit">Save links</button>
            <div class="alert" id="contact-ok">Links saved.</div>
          </form>
        </section>

        <section>
          <h2>Published</h2>
          <div id="admin-log-list"></div>
        </section>
      </div>
    </main>
    <div class="page"><hr class="sep" /></div>
    <div data-footer></div>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
