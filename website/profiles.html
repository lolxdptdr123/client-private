<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile generator | Helix</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="nav-wrap" data-nav="docs"></div>
    <div class="spacer"></div>
    <main class="page-narrow">
      <h1>Profile generator</h1>
      <p class="lede">Build a starting preset. Values stay in the browser.</p>
      <p><input id="profile-name" type="text" placeholder="Profile name" /></p>
      <p class="cat">Style</p>
      <div class="licenses" data-select="preset">
        <div class="card selected" data-option="subtle"><h3>Subtle</h3></div>
        <div class="card" data-option="balanced"><h3>Balanced</h3></div>
        <div class="card" data-option="blatant"><h3>Blatant</h3></div>
      </div>
      <p class="form-actions"><button class="btn btn-light" id="generate-profile" type="button">Generate a profile →</button></p>
      <div class="alert" id="profile-out"></div>
    </main>
    <div class="page"><hr class="sep" /></div>
    <div data-footer></div>
    <script src="js/app.js"></script>
  </body>
</html>
